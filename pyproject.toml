[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dabe"
version = "0.1.0"
description = "Density-Adaptive Variable-Width Bitmask Encoding"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "lightning>=2.0",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "wandb>=0.15",
    "datasets>=2.14",
    "transformers>=4.35",
    "sentencepiece>=0.1",
    "numpy>=1.24",
    "tqdm>=4.65",
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.optional-dependencies]
dev = [
    "black",
    "ruff",
    "mypy",
    "pre-commit",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
