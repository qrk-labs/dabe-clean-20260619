<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560">
<rect width="100%" height="100%" fill="#fbfaf6"/>
<style>
  .title { font-family: Georgia, serif; font-size: 22px; font-weight: 700; fill: #1e2724; }
  .subtitle { font-family: Georgia, serif; font-size: 13px; fill: #65736f; }
  .axis { stroke: #1e2724; stroke-width: 1.2; }
  .grid { stroke: #d8ddd7; stroke-width: 1; }
  .tick { font-family: Helvetica, Arial, sans-serif; font-size: 11px; fill: #65736f; }
  .label { font-family: Helvetica, Arial, sans-serif; font-size: 12px; fill: #1e2724; }
  .small { font-family: Helvetica, Arial, sans-serif; font-size: 10px; fill: #65736f; }
</style>
<text x="70" y="40" class="title">Fig. 1. Matched 20bpt comparator</text>
<text x="70" y="62" class="subtitle">Adaptive sparse repair wins at essentially the same bitrate.</text>
<text x="70" y="85" class="label">Token accuracy</text>
<line x1="70" y1="450" x2="400" y2="450" class="axis"/>
<line x1="70" y1="110" x2="70" y2="450" class="axis"/>
<line x1="70" y1="450.0" x2="400" y2="450.0" class="grid"/>
<text x="62" y="454.0" text-anchor="end" class="tick">0.00</text>
<line x1="70" y1="365.0" x2="400" y2="365.0" class="grid"/>
<text x="62" y="369.0" text-anchor="end" class="tick">0.25</text>
<line x1="70" y1="280.0" x2="400" y2="280.0" class="grid"/>
<text x="62" y="284.0" text-anchor="end" class="tick">0.50</text>
<line x1="70" y1="195.0" x2="400" y2="195.0" class="grid"/>
<text x="62" y="199.0" text-anchor="end" class="tick">0.75</text>
<line x1="70" y1="110.0" x2="400" y2="110.0" class="grid"/>
<text x="62" y="114.0" text-anchor="end" class="tick">1.00</text>
<rect x="134" y="205.0" width="88" height="245.0" rx="5" fill="#a4512b"/>
<text x="178.0" y="197.0" text-anchor="middle" class="label">0.720</text>
<text x="178.0" y="473" text-anchor="middle" class="small">EXP-093</text>
<rect x="264" y="146.5" width="88" height="303.5" rx="5" fill="#1f6f68"/>
<text x="308.0" y="138.5" text-anchor="middle" class="label">0.893</text>
<text x="308.0" y="473" text-anchor="middle" class="small">EXP-092-0.025</text>
<text x="520" y="85" class="label">Mean chunk deviation</text>
<line x1="520" y1="450" x2="850" y2="450" class="axis"/>
<line x1="520" y1="110" x2="520" y2="450" class="axis"/>
<line x1="520" y1="450.0" x2="850" y2="450.0" class="grid"/>
<text x="512" y="454.0" text-anchor="end" class="tick">0.00</text>
<line x1="520" y1="365.0" x2="850" y2="365.0" class="grid"/>
<text x="512" y="369.0" text-anchor="end" class="tick">5.01</text>
<line x1="520" y1="280.0" x2="850" y2="280.0" class="grid"/>
<text x="512" y="284.0" text-anchor="end" class="tick">10.02</text>
<line x1="520" y1="195.0" x2="850" y2="195.0" class="grid"/>
<text x="512" y="199.0" text-anchor="end" class="tick">15.03</text>
<line x1="520" y1="110.0" x2="850" y2="110.0" class="grid"/>
<text x="512" y="114.0" text-anchor="end" class="tick">20.04</text>
<rect x="584" y="146.4" width="88" height="303.6" rx="5" fill="#a4512b"/>
<text x="628.0" y="138.4" text-anchor="middle" class="label">17.891</text>
<text x="628.0" y="473" text-anchor="middle" class="small">EXP-093</text>
<rect x="714" y="333.5" width="88" height="116.5" rx="5" fill="#1f6f68"/>
<text x="758.0" y="325.5" text-anchor="middle" class="label">6.865</text>
<text x="758.0" y="473" text-anchor="middle" class="small">EXP-092-0.025</text>
<text x="844" y="128" text-anchor="end" class="small">lower is better</text>
</svg>
