experiment:
  name: dabe_tokenizer_autoencoder_smoke
  seed: 42
  device: cuda
dabe_tokenizer:
  dataset:
    dataset_name: roneneldan/TinyStories
    train_split: train
    val_split: validation
    train_samples: 4096
    val_samples: 512
    text_field: text
    allow_synthetic_fallback: false
    streaming: true
  codec:
    tokenizer_name: gpt2
    force_fast_tokenizer: true
    chunk_size_tokens: 64
    chunk_stride_tokens: 64
    code_bits: 512
    tokenizer_batch_size: 32
  model:
    embed_dim: 64
    hidden_dim: 256
    dropout: 0.0
    decoder_mode: hierarchical_local
    diffusion_steps: 64
    diffusion_layers: 2
    diffusion_heads: 4
    code_decoder_layers: 2
    code_decoder_heads: 4
    hierarchical_block_tokens: 16
    hierarchical_decoder_layers: 2
    hierarchical_decoder_heads: 4
    hierarchical_refine_layers: 1
  training:
    batch_size: 32
    num_workers: 4
    learning_rate: 0.0003
    weight_decay: 0.01
    bit_balance_weight: 0.01
    diffusion_loss_weight: 0.1
    max_steps: 12000
    val_check_interval: 300
    grad_clip: 1.0
    log_every_n_steps: 5
    eta_log_interval_steps: 100
    eta_stdout: true
    enable_csv_logger: true
    enable_progress_bar: false
    checkpoint_every_n_train_steps: 2000
    checkpoint_save_top_k: 1
    checkpoint_save_last: true
    precision: bf16-mixed
