experiment:
  name: dabe_tokenizer_autoencoder_smoke
  seed: 42
  device: cuda
dabe_tokenizer:
  dataset:
    dataset_name: roneneldan/TinyStories
    train_split: train
    val_split: validation
    train_samples: 4096
    val_samples: 512
    text_field: text
    allow_synthetic_fallback: false
    streaming: true
  codec:
    tokenizer_name: gpt2
    force_fast_tokenizer: true
    chunk_size_tokens: 64
    chunk_stride_tokens: 64
    code_bits: 256
    tokenizer_batch_size: 32
  model:
    embed_dim: 64
    hidden_dim: 256
    dropout: 0.0
  training:
    batch_size: 16
    num_workers: 4
    learning_rate: 0.0003
    weight_decay: 0.01
    bit_balance_weight: 0.01
    max_steps: 2000
    val_check_interval: 100
    grad_clip: 1.0
    log_every_n_steps: 5
    enable_csv_logger: true
    enable_progress_bar: false
    checkpoint_every_n_train_steps: 500
    checkpoint_save_top_k: 1
    checkpoint_save_last: true
    precision: bf16-mixed
