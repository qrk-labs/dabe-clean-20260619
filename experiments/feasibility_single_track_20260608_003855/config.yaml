experiment:
  name: feasibility_single_track
  seed: 42
  device: auto
  train: true
  track: feasibility
  feasibility_stage: all
tokenization:
  type: density_adaptive_bitmask
router:
  type: entropy
  hidden_dim: 128
  num_layers: 1
  density_lower: 0.0
  density_upper: 1.0
  min_bit_width: 8
  max_bit_width: 24
  num_header_bits: 4
  lm_model: distilbert-base-uncased
  stride: 1
  segment_stride: 1
encoder:
  type: lfq
  max_bit_width: 24
  num_header_bits: 4
  embed_dim: 256
  num_codes: 24
  vocab_size: 8192
  lower_case: true
backbone:
  type: dabe_transformer
  hidden_dim: 512
  num_layers: 6
  num_heads: 8
  ff_dim: 2048
  dropout: 0.1
  max_seq_len: 256
  vocab_size: 8192
  max_bit_width: 28
training:
  learning_rate: 0.0003
  weight_decay: 0.01
  max_epochs: 1
  batch_size: 2
  grad_clip: 1.0
  warmup_steps: 50
  recon_weight: 1.0
  contrastive_weight: 0.05
  contrastive_temperature: 0.07
  contrastive_margin: 0.5
  early_stop_patience: 2
data:
  dataset_name: unimelb-nlp/wikiann
  synthetic_only: false
  source_langs:
  - en
  - fr
  target_langs:
  - en
  - fr
  max_samples: 256
  num_workers: 0
logging:
  wandb_project: dabe-feasibility
  wandb_entity: null
  wandb_mode: offline
  log_every_n_steps: 5
evaluation:
  eval_every_n_steps: 100
  save_every_n_epochs: 1
feasibility:
  bpe_model_name: gpt2
  baseline_backbone:
    hidden_dim: 320
    num_layers: 6
    num_heads: 5
    ff_dim: 1280
    tie_weights: true
  tokenizer_training:
    dataset_name: roneneldan/TinyStories
    train_split: train
    eval_split: validation
    train_samples: 12
    eval_samples: 4
    vocab_size: 8192
    epochs: 1
    batch_size: 8
    learning_rate: 0.001
    device: cpu
  lm_data:
    dataset_name: roneneldan/TinyStories
    train_split: train
    val_split: validation
    train_samples: 8
    val_samples: 4
    seq_len: 16
  decision_gate:
    loss_tolerance_ratio: 0.15
    min_compression_ratio: 1.0
