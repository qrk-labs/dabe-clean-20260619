experiment:
  name: fp16_chunk_window16_smoke
  seed: 42
  device: auto
fp16_chunk:
  dataset:
    dataset_name: roneneldan/TinyStories
    train_split: train
    val_split: validation
    train_samples: 4096
    val_samples: 512
    text_field: text
    allow_synthetic_fallback: false
    streaming: true
  compression:
    tokenizer_name: gpt2
    force_fast_tokenizer: true
    chunk_size_tokens: 16
    window_overlap: 0
    dtype: float16
    tokenizer_batch_size: 64
  model:
    hidden_dim: 256
    num_layers: 4
    num_heads: 4
    ff_dim: 1024
    dropout: 0.1
    attention:
      backend: auto
  training:
    compressed_seq_len: 8
    window_stride: 1
    batch_size: 64
    num_workers: 0
    learning_rate: 0.0003
    weight_decay: 0.01
    max_steps: 1500
    val_check_interval: 100
    grad_clip: 1.0
    log_every_n_steps: 20
    precision: 32-true
  gate:
    require_stable: true
    require_downward_trend: true
    min_relative_drop: 0.0
