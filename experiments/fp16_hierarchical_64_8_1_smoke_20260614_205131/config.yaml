experiment:
  name: fp16_hierarchical_64_8_1_smoke
  seed: 42
  device: auto
fp16_chunk:
  dataset:
    dataset_name: roneneldan/TinyStories
    train_split: train
    val_split: validation
    train_samples: 2048
    val_samples: 512
    text_field: text
    allow_synthetic_fallback: false
    streaming: true
  compression:
    tokenizer_name: gpt2
    force_fast_tokenizer: true
    chunk_size_tokens: 64
    window_overlap: 0
    dtype: float16
    tokenizer_batch_size: 64
  model:
    hidden_dim: 256
    num_layers: 4
    num_heads: 4
    ff_dim: 1024
    dropout: 0.1
    attention:
      backend: auto
  training:
    compressed_seq_len: 8
    window_stride: 1
    batch_size: 64
    num_workers: 0
    learning_rate: 0.0003
    weight_decay: 0.01
    max_steps: 300
    val_check_interval: 100
    grad_clip: 1.0
    log_every_n_steps: 20
    eta_log_interval_steps: 20
    enable_csv_logger: true
    checkpoint_every_n_train_steps: 0
    checkpoint_save_top_k: 1
    checkpoint_save_last: true
    precision: 32-true
  diffusion:
    enabled: true
    latent_dim: 128
    timesteps: 256
    loss_weight: 0.25
    reconstruction_weight: 0.2
    vocab_size: 50257
    chunk_size_tokens: 64
  gate:
    require_stable: true
    require_downward_trend: true
    min_relative_drop: 0.0
  hierarchical:
    enabled: true
    coarse_chunk_size: 64
    mid_chunk_size: 8
    fine_chunk_size: 1
    router_temperature: 1.0
    hard_routing: false
    route_balance_weight: 0.02
    route_entropy_weight: 0.0
    route_target:
    - 0.55
    - 0.3
    - 0.15
    base_residual_weight: 0.15
fp16_chunk_modal:
  use_memmap: true
