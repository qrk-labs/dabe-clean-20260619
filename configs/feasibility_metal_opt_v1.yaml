defaults:
  - feasibility
  - _self_

experiment:
  name: "feasibility_standard_dabe_metal_opt_v1"
  track: "feasibility"
  feasibility_stage: "all"
  seed: 42
  device: "auto"
  train: true

router:
  min_bit_width: 10
  max_bit_width: 24

encoder:
  embed_dim: 320
  vocab_size: 9216

backbone:
  hidden_dim: 640
  num_layers: 6
  num_heads: 8
  ff_dim: 2560
  vocab_size: 9216

training:
  learning_rate: 2e-4
  weight_decay: 0.005
  max_epochs: 2
  batch_size: 4

feasibility:
  tokenizer_training:
    vocab_size: 9216
    epochs: 3
    learning_rate: 8e-4
  decision_gate:
    loss_tolerance_ratio: 0.1
    min_compression_ratio: 1.0

evaluation:
  save_top_k: 0
