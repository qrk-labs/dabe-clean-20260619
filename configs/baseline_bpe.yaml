experiment:
  name: "baseline_bpe"
  seed: 42
  device: "auto"
  train: true

tokenization:
  type: "bpe"
  vocab_size: 32000
  tokenizer_path: "bert-base-multilingual-cased"

backbone:
  type: "bpe_transformer"
  hidden_dim: 512
  num_layers: 6
  num_heads: 8
  ff_dim: 2048
  dropout: 0.1
  max_seq_len: 512
  vocab_size: 32000

training:
  learning_rate: 1e-4
  weight_decay: 0.01
  max_epochs: 10
  batch_size: 16
  grad_clip: 1.0
  warmup_steps: 1000

data:
  source_langs: ["en", "fr", "es", "de", "zh"]
  target_langs: ["en", "fr", "es", "de", "zh"]
  max_samples: 100000
  num_workers: 0

logging:
  wandb_project: "dabe"
  wandb_entity: null
  log_every_n_steps: 10

evaluation:
  eval_every_n_steps: 500
  save_every_n_epochs: 1
