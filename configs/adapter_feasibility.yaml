defaults:
  - local_metal
  - _self_

experiment:
  name: "adapter_route_feasibility"
  track: "adapter_feasibility"
  seed: 42
  device: "auto"
  train: true

backbone:
  hidden_dim: 320
  num_layers: 6
  num_heads: 5
  ff_dim: 1280
  dropout: 0.1
  max_seq_len: 256
  tie_weights: true

training:
  learning_rate: 3e-4
  weight_decay: 0.01
  max_epochs: 1
  batch_size: 4
  grad_clip: 1.0

data:
  num_workers: 0

logging:
  wandb_project: "dabe-adapter"
  wandb_entity: null
  wandb_mode: "offline"
  log_every_n_steps: 5

feasibility:
  bpe_model_name: "gpt2"
  adapter:
    min_bit_width: 8
    max_bit_width: 24
    num_header_bits: 4
  adapter_backbone:
    hidden_dim: 320
    num_layers: 6
    num_heads: 5
    ff_dim: 1280
    tie_weights: true
  baseline_backbone:
    hidden_dim: 320
    num_layers: 6
    num_heads: 5
    ff_dim: 1280
    tie_weights: true
  adapter_data:
    dataset_name: "roneneldan/TinyStories"
    train_split: "train"
    val_split: "validation"
    train_samples: 2048
    val_samples: 256
    seq_len: 64
  decision_gate:
    loss_tolerance_ratio: 0.10
    min_width_std: 0.20
