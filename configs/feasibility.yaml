defaults:
  - local_metal
  - _self_

experiment:
  name: "feasibility_single_track"
  track: "feasibility"
  feasibility_stage: "all"
  seed: 42
  device: "auto"
  train: true

router:
  type: "entropy"
  lm_model: "distilbert-base-uncased"
  compute_mode: "quality"
  stride: 1
  segment_stride: 1
  density_lower: 0.0
  density_upper: 1.0
  min_bit_width: 8
  max_bit_width: 24
  num_header_bits: 4

encoder:
  type: "lfq"
  max_bit_width: 24
  num_header_bits: 4
  embed_dim: 256
  num_codes: 24
  vocab_size: 8192
  lower_case: true

backbone:
  type: "dabe_transformer"
  hidden_dim: 512
  num_layers: 6
  num_heads: 8
  ff_dim: 2048
  dropout: 0.1
  max_seq_len: 256
  vocab_size: 8192
  max_bit_width: 28

training:
  learning_rate: 3e-4
  weight_decay: 0.01
  max_epochs: 1
  batch_size: 4
  grad_clip: 1.0

data:
  num_workers: 0

logging:
  wandb_project: "dabe-feasibility"
  wandb_entity: null
  wandb_mode: "offline"
  log_every_n_steps: 5
  eta_log_every_n_steps: 50

optimization:
  profile:
    enabled: false
    steps: 200
  compile:
    enabled: false
    mode: "reduce-overhead"
  attention_backend: "auto"
  data_cache:
    mode: "none"   # none|build|reuse
    root: null
    preencode_to_disk: false
    tokenizer_batch_size: 64
  device_profile: "mps_safe"   # cuda_fast|mps_safe|cpu_safe
  grad_accumulation_preset: "none"
  force_fast_tokenizer: true
  v4_distill:
    compressed_kv_proxy: false
    balance_bias_update: false
    mtp_heads: 0
    mtp_loss_weight: 0.1

feasibility:
  bpe_model_name: "gpt2"
  baseline_backbone:
    hidden_dim: 320
    num_layers: 6
    num_heads: 5
    ff_dim: 1280
    tie_weights: true
  tokenizer_training:
    dataset_name: "roneneldan/TinyStories"
    train_split: "train"
    eval_split: "validation"
    train_samples: 2048
    eval_samples: 256
    vocab_size: 8192
    epochs: 2
    batch_size: 256
    learning_rate: 1e-3
    device: "cpu"
  lm_data:
    dataset_name: "roneneldan/TinyStories"
    train_split: "train"
    val_split: "validation"
    train_samples: 2048
    val_samples: 256
    seq_len: 64
  decision_gate:
    loss_tolerance_ratio: 0.15
    min_compression_ratio: 1.0
