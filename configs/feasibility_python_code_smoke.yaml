defaults:
  - feasibility
  - _self_

experiment:
  name: "feasibility_python_code_smoke"
  track: "feasibility"
  feasibility_stage: "all"
  seed: 42
  device: "auto"
  train: true

router:
  min_bit_width: 10
  max_bit_width: 24

encoder:
  embed_dim: 224
  vocab_size: 6144

backbone:
  hidden_dim: 384
  num_layers: 4
  num_heads: 6
  ff_dim: 1536
  vocab_size: 6144

training:
  learning_rate: 2.5e-4
  weight_decay: 0.01
  max_epochs: 1
  batch_size: 8
  grad_clip: 1.0

data:
  num_workers: 0

optimization:
  device_profile: "cuda_fast"
  compile:
    enabled: false
  data_cache:
    mode: "build"
    preencode_to_disk: false
    tokenizer_batch_size: 64

feasibility:
  bpe_model_name: "gpt2"
  tokenizer_training:
    dataset_name: "__python_code__"
    train_split: "train"
    eval_split: "validation"
    train_samples: 2048
    eval_samples: 256
    vocab_size: 6144
    epochs: 1
    batch_size: 256
    learning_rate: 8e-4
    device: "cuda"
    text_field: "text"
    allow_synthetic_fallback: false
    streaming: false
  lm_data:
    dataset_name: "__python_code__"
    train_split: "train"
    val_split: "validation"
    train_samples: 2048
    val_samples: 256
    seq_len: 64
    text_field: "text"
    allow_synthetic_fallback: false
    streaming: false
  decision_gate:
    loss_tolerance_ratio: 0.2
    min_compression_ratio: 1.0

logging:
  enable_progress_bar: false

evaluation:
  save_top_k: 0
