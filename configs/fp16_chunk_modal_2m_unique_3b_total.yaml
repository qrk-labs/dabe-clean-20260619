defaults:
  - fp16_chunk_modal_2m_unique_1b_total
  - _self_

experiment:
  name: "fp16_chunk_modal_2m_unique_3b_total"
  seed: 42
  device: "cuda"

fp16_chunk:
  training:
    # 3x processed-token budget vs 1B run while holding unique-token pool fixed.
    max_steps: 91554
    val_check_interval: 2000
    checkpoint_every_n_train_steps: 5000
